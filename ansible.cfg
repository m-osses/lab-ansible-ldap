[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# La crea scripts/terraform-secrets.sh (no se sube al repo)
vault_password_file = .vault_pass
interpreter_python = auto_silent
callback_result_format = yaml
# Las VMs del lab se destruyen y recrean: sus claves de host cambian
host_key_checking = False
retry_files_enabled = False

[ssh_connection]
pipelining = True
