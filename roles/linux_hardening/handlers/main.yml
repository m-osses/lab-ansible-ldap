---
# Valida la configuración completa (no solo el archivo nuevo) antes de recargar:
# un sshd roto deja a todos afuera
- name: Recargar SSH
  ansible.builtin.shell: sshd -t && systemctl reload ssh
  changed_when: true

- name: Recargar firewall
  ansible.builtin.command: nft -f /etc/nftables.conf
  changed_when: true

- name: Reiniciar fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Aplicar sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
